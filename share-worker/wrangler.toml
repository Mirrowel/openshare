name = "openshare-worker"
main = "worker.js"
compatibility_date = "2026-01-15"
workers_dev = true
preview_urls = false

# See README.md for the full protocol. Secrets (wrangler secret put):
#   CREATE_TOKEN — required to create shares (the plugin holds it)
[vars]
# Hard cap for per-share ttlDays overrides (client may request less).
MAX_TTL_DAYS = "90"
# Server policy — the worker owns socket rules + the allowed client sync
# cadence window; plugins clamp themselves in (init ack + /health). All
# optional; defaults live in worker.js resolvePolicy().
#   SOCKET_POLICY: auto (default; Cloudflare runtime -> persistent since
#     hibernation makes idle sockets free, anything else -> turn) | persistent | turn
#   TURN_GRACE_MS: turn mode, socket stays warm after a turn settles (120000)
#   IDLE_DROP_MS: turn mode, no-signal fallback drop (600000)
#   FINALIZE_AFTER_MS: plugin gone without goodbye -> share settles to
#     "interrupted" (300000)
#   DEBOUNCE_MIN_MS / DEBOUNCE_MAX_MS: allowed client sync interval (1000 / 60000)
#   COMPLETED_DELAY_MAX_MS: allowed client completed-delay (60000)
# SOCKET_POLICY = "auto"
# TURN_GRACE_MS = "120000"
# IDLE_DROP_MS = "600000"
# FINALIZE_AFTER_MS = "300000"
# DEBOUNCE_MIN_MS = "1000"
# DEBOUNCE_MAX_MS = "60000"
# COMPLETED_DELAY_MAX_MS = "60000"
# Branding: edit openshare.config.json (bundled at deploy) — that is the
# primary skin. BRAND_* env vars here override it if you ever need both.

[[kv_namespaces]]
binding = "SHARE_INDEX"
id = "a3467b6b06c8431786eae9ac5e68ada4"

[[durable_objects.bindings]]
name = "SHARE_DO"
class_name = "ShareDO"

[[durable_objects.bindings]]
name = "SHARE_CONTROL"
class_name = "ControlDO"

[[durable_objects.bindings]]
name = "SWEEPER"
class_name = "SweeperDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ShareDO", "SweeperDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["ControlDO"]

# Static viewer: the vendored upstream share page (tools/share-viewer,
# built with `npm run build` there — 24MB dist incl. shiki grammars +
# KaTeX fonts + markdown/diff workers). SPA handling serves index.html
# for /s/<id> and /s/<id>/<subagent-N>; API + health hit the worker.
[assets]
directory = "../share-viewer/dist"
html_handling = "auto-trailing-slash"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/health", "/branding"]
