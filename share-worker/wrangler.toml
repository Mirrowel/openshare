name = "openshare-worker"
main = "worker.js"
compatibility_date = "2026-01-15"
workers_dev = true
preview_urls = false

# See README.md for the full protocol. Secrets (wrangler secret put):
#   CREATE_TOKEN — root admin bootstrap (everything); regular plugins
#                  enroll via /api/enroll instead (public) or an access
#                  code minted with POST /api/admin/codes (private).
[vars]
# Hard cap for per-share ttlDays overrides (client may request less).
MAX_TTL_DAYS = "90"
# AUTH_MODE: private (default — enrollment needs an access code) | public
#            (anyone knowing the hostname can enroll; rate-limited per IP)
# AUTH_MODE = "private"
# Global cap on anonymous (ownerless) share creations per rolling hour,
# ALL anonymous visitors combined — public mode only. Each create costs
# a Durable Object + one KV write.
# ANON_CREATE_HOURLY = "100"
# Per-token default limits for newly enrolled users (0 = unlimited):
#   DEFAULT_MAX_LIVE_SHARES — max non-swept shares owned at once
#   DEFAULT_MAX_TTL_DAYS    — extra cap on per-share ttlDays
#   DEFAULT_DAILY_CREATES   — max share creations per UTC day
# DEFAULT_MAX_LIVE_SHARES = "0"
# DEFAULT_MAX_TTL_DAYS = "0"
# DEFAULT_DAILY_CREATES = "0"
# Server policy — the worker owns socket rules + the allowed client sync
# cadence window; plugins clamp themselves in (init ack + /health). All
# optional; defaults live in worker.js resolvePolicy().
#   SOCKET_POLICY: auto (default; Cloudflare runtime -> persistent since
#     hibernation makes idle sockets free, anything else -> turn) | persistent | turn
#   TURN_GRACE_MS: turn mode, socket stays warm after a turn settles (120000)
#   IDLE_DROP_MS: turn mode, no-signal fallback drop (600000)
#   FINALIZE_AFTER_MS: plugin gone without goodbye -> share settles to
#     "interrupted" (300000)
#   DEBOUNCE_MIN_MS / DEBOUNCE_MAX_MS: allowed client sync interval (1000 / 60000)
#   COMPLETED_DELAY_MAX_MS: allowed client completed-delay (60000)
# SOCKET_POLICY = "auto"
# TURN_GRACE_MS = "120000"
# IDLE_DROP_MS = "600000"
# FINALIZE_AFTER_MS = "300000"
# DEBOUNCE_MIN_MS = "1000"
# DEBOUNCE_MAX_MS = "60000"
# COMPLETED_DELAY_MAX_MS = "60000"
# Branding: edit openshare.config.json (bundled at deploy) — that is the
# primary skin. BRAND_* env vars here override it if you ever need both.

[[kv_namespaces]]
binding = "SHARE_INDEX"
id = "a3467b6b06c8431786eae9ac5e68ada4"

[[durable_objects.bindings]]
name = "SHARE_DO"
class_name = "ShareDO"

[[durable_objects.bindings]]
name = "SHARE_CONTROL"
class_name = "ControlDO"

[[durable_objects.bindings]]
name = "SWEEPER"
class_name = "SweeperDO"

[[durable_objects.bindings]]
name = "AUTH_DO"
class_name = "AuthDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ShareDO", "SweeperDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["ControlDO"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["AuthDO"]

# Static viewer: the vendored upstream share page (share-viewer/,
# built with `npm run build` there — 24MB dist incl. shiki grammars +
# KaTeX fonts + markdown/diff workers). SPA handling serves index.html
# for /s/<id> and /s/<id>/<sub>; API + health hit the worker. /s/* and /
# also run the worker first so link-preview crawlers (Discordbot,
# TelegramBot, ...) can be served og-tag-injected HTML — regular
# browsers pass straight through to the assets.
[assets]
binding = "ASSETS"
directory = "../share-viewer/dist"
html_handling = "auto-trailing-slash"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/health", "/branding", "/s/*", "/"]
