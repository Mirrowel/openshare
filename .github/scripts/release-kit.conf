# Release kit configuration (one per repo; sourced by every kit entry point
# through kit-lib.sh: compute-version.sh, release-kit.sh, npm-changed.sh,
# generate-release-notes.sh, and the cleanup workflow).
#
#   MANIFESTS         space-separated package manifests (repo-root-relative)
#                     that carry the release version. The stamp writes them
#                     all; the first is the committed-state reference.
#   STABLE_BRANCHES   space-separated branches that release to the `latest`
#                     channel (normal bumps, no suffix). Every other branch
#                     is a development channel that stacks `-<name>.N`
#                     prereleases per push.
#   MAX_BUMP          highest bump an automatic (conventional-commit)
#                     release may take: patch | minor | major. Manual
#                     designations (VERSION pin, dispatch inputs) bypass it.
#   RELEASE_GATE      on  = versioned (`latest` channel) releases pause in
#                         the `release` GitHub environment for a human
#                         approval, with the computed version and notes
#                         preview in the run (one-time setup: create the
#                         environment in repo settings and add reviewers).
#                     off = versioned releases ship without pausing.
#   PROTECTED_BRANCHES  comma-separated branches the cleanup workflow never
#                       purges releases for.

MANIFESTS="share-plugin/package.json share-worker/package.json share-server/package.json share-viewer/package.json"
STABLE_BRANCHES="master"
MAX_BUMP="minor"
RELEASE_GATE="off"
PROTECTED_BRANCHES="main,master"

# Path filters (globs, repo-root-relative). RELEASE_PATHS must equal the
# workflow's \paths:\ trigger block (kit-check enforces the sync); it also
# drives release_relevant_changes in compute-version.sh and the dispatch
# hook's stamp decision, so a docs-only push never creates a release.
# NPM_PATHS + NPM_GATE gate the npm publish: only the plugin ships to npm,
# so releases without plugin changes tag the system version but skip the
# publish (npm version numbers gap - every published version is real).
RELEASE_PATHS="share-plugin/src/** share-plugin/README.md share-plugin/LICENSE share-plugin/openshare.config.json share-plugin/ci/** share-plugin/package.json share-plugin/package-lock.json share-plugin/tsconfig*.json share-worker/worker.js share-worker/og/** share-worker/openshare.config.json share-worker/wrangler.toml share-worker/package.json share-server/server.ts share-server/Dockerfile share-server/package.json share-viewer/src/** share-viewer/public/** share-viewer/scripts/** share-viewer/vendor/** share-viewer/index.html share-viewer/vite.config.ts share-viewer/package.json share-viewer/package-lock.json share-viewer/bun.lock tools/*.mjs tools/view-export.py"
NPM_PATHS="share-plugin/src/** share-plugin/README.md share-plugin/LICENSE share-plugin/openshare.config.json share-plugin/ci/** share-plugin/package.json share-plugin/package-lock.json share-plugin/tsconfig*.json"
NPM_GATE="on"
